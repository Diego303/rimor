<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pantallas de Rimor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: página de referencia con un marco de app (raíl + una columna de lectura). Inicio funciona como un chat.
   Estilo Instrumento: diseño industrial, «menos, pero mejor». Neutros cálidos, tinta casi negra y un solo naranja
   (--key) para lo que importa: enviar, la serie destacada de una gráfica y los pilotos. Archivo + Roboto Mono.
   Fuente de verdad de estos tokens: rimor-diseno.md. */
:root{
  --page:#DCD9D2; --app:#E8E6E1; --panel:#F6F5F1; --panel-2:#E3E0D9; --ink:#191919; --muted:#67645E; --faint:#737068; --line:#CCC8BF; --line-2:#DDD9D1;
  --accent:#191919; --accent-ink:#F6F5F1; --accent-soft:#E3E0D9;
  --key:#EE4F1F; --key-ink:#191919; --key-text:#C9401A; --key-soft:#F8D9CD;
  --ok:#336E45; --ok-soft:#DCEBDF; --warn:#8A570B; --warn-soft:#F3E6CF; --bad:#B32F27; --bad-soft:#F5DAD6;
  --heat-1:#EAD9CC; --heat-2:#F0B79E; --heat-3:#EE8A60; --heat-4:#EE4F1F;
  --grille:rgba(25,25,25,.16); --shadow:0 1px 2px rgba(0,0,0,.07);
  --k-x:#45433F; --k-x-bg:#E3E0D9; --k-err:#B32F27; --k-err-bg:#F5DAD6;
  --k-log:var(--k-x); --k-log-bg:var(--k-x-bg); --k-med:var(--k-x); --k-med-bg:var(--k-x-bg); --k-prm:var(--k-x); --k-prm-bg:var(--k-x-bg); --k-md:var(--k-x); --k-md-bg:var(--k-x-bg); --k-url:var(--k-x); --k-url-bg:var(--k-x-bg); --k-idea:var(--k-x); --k-idea-bg:var(--k-x-bg); --k-dat:var(--k-x); --k-dat-bg:var(--k-x-bg); --k-cod:var(--k-x); --k-cod-bg:var(--k-x-bg); --k-cmp:var(--k-x); --k-cmp-bg:var(--k-x-bg); --k-inv:var(--k-x); --k-inv-bg:var(--k-x-bg); --k-doc:var(--k-x); --k-doc-bg:var(--k-x-bg);
  --f-d:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-b:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-m:"Roboto Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#121211; --app:#1A1A19; --panel:#242422; --panel-2:#2E2D2B; --ink:#EDEBE6; --muted:#9D998F; --faint:#8F8B83; --line:#3A3936; --line-2:#2F2E2B;
  --accent:#EDEBE6; --accent-ink:#1A1A19; --accent-soft:#34332F;
  --key:#FF6A3D; --key-ink:#1A1A19; --key-text:#FF7E55; --key-soft:#40291F;
  --ok:#7DC48F; --ok-soft:#1F3125; --warn:#E2A84C; --warn-soft:#3A2D16; --bad:#FF7A6B; --bad-soft:#3F201D;
  --heat-1:#3A2A22; --heat-2:#6A3A26; --heat-3:#B5502E; --heat-4:#FF6A3D;
  --grille:rgba(255,255,255,.10); --shadow:none;
  --k-x:#CFCBC2; --k-x-bg:#2E2D2B; --k-err:#FF7A6B; --k-err-bg:#3F201D;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#121211; --app:#1A1A19; --panel:#242422; --panel-2:#2E2D2B; --ink:#EDEBE6; --muted:#9D998F; --faint:#8F8B83; --line:#3A3936; --line-2:#2F2E2B;
  --accent:#EDEBE6; --accent-ink:#1A1A19; --accent-soft:#34332F;
  --key:#FF6A3D; --key-ink:#1A1A19; --key-text:#FF7E55; --key-soft:#40291F;
  --ok:#7DC48F; --ok-soft:#1F3125; --warn:#E2A84C; --warn-soft:#3A2D16; --bad:#FF7A6B; --bad-soft:#3F201D;
  --heat-1:#3A2A22; --heat-2:#6A3A26; --heat-3:#B5502E; --heat-4:#FF6A3D;
  --grille:rgba(255,255,255,.10); --shadow:none;
  --k-x:#CFCBC2; --k-x-bg:#2E2D2B; --k-err:#FF7A6B; --k-err-bg:#3F201D;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f-b);font-size:14px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-d);margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
svg.i{flex:none;display:block}
.mono{font-family:var(--f-m);font-size:.9em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .sm{font-size:13px} .xs{font-size:12px}
.lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* ---------- Página de referencia ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;color:var(--accent)}
.brand b{font-family:var(--f-d);font-size:21px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.brand span{color:var(--muted);font-size:12.5px}
.top .ctl{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
#sel{display:none;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:5px 8px;max-width:100%}
.page{display:grid;grid-template-columns:232px minmax(0,1fr)}
.specnav{border-right:1px solid var(--line);background:var(--panel);padding-block:14px 40px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:10px;display:flex;flex-direction:column;gap:1px}
.specnav .g{margin:14px 8px 4px}
.specnav .g:first-child{margin-top:2px}
.specnav button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px}
.specnav button:hover{background:var(--panel-2)}
.specnav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.new{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.fase{font-family:var(--f-m);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;white-space:nowrap;font-weight:500}
.content{padding-block:18px 64px;padding-left:clamp(16px,2.4vw,28px);padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:14px}
.shead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.shead h1{font-size:22px;font-weight:700}
.shead p{color:var(--muted);flex-basis:100%;max-width:80ch}
.frame-wrap{display:flex;justify-content:center}
.frame{position:relative;width:100%;max-width:1240px;background:var(--app);border:1px solid var(--line);border-radius:12px;container-type:inline-size;container-name:app;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.is-mobile .frame{max-width:390px}
.devnotes{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.devnotes summary{cursor:pointer;font-weight:600;font-size:13.5px}
.devgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:10px}
.devgrid ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.idl{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.idc{font-family:var(--f-m);font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 6px}
.idc.prop{background:var(--warn-soft);color:var(--warn)}
@media (max-width:1150px){.devgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.page{grid-template-columns:minmax(0,1fr)}.specnav{display:none}#sel{display:block}.devgrid{grid-template-columns:minmax(0,1fr)}.top .ctl{margin-left:0}}

/* ---------- Carcasa de la app ---------- */
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:720px}
.rail{grid-column:1;grid-row:1;background:var(--panel);border-right:1px solid var(--line);border-radius:12px 0 0 12px;padding:14px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.rail .rbrand{display:flex;align-items:center;gap:8px;padding:2px 8px 14px;color:var(--accent)}
.rail .rbrand b{font-family:var(--f-d);font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.rb{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:13.5px;text-align:left;width:100%;min-width:0;color:var(--ink)}
.rb span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb:hover{background:var(--panel-2)}
.rb[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rb .n{margin-left:auto;font-family:var(--f-m);font-size:11px;color:var(--muted)}
.rb[aria-current="page"] .n{color:var(--accent)}
.rail .sec{margin:14px 9px 3px}
.rail .space{margin-top:auto;border:0;border-top:1px solid var(--line);padding:10px 9px 2px;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);cursor:pointer;background:transparent;text-align:left;width:100%}
.rail .space b{color:var(--ink);font-size:13px;font-weight:600}
.amain{grid-column:2;grid-row:1;padding:22px 24px 0;min-width:0;display:flex;flex-direction:column}
.col{width:100%;max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-bottom:28px;flex:1}
.col.wide{max-width:none}
@container app (max-width:720px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{grid-column:1;grid-row:2;flex-direction:row;overflow-x:auto;border-right:0;border-top:1px solid var(--line);border-radius:0 0 12px 12px;padding:6px;gap:2px;position:sticky;bottom:0;z-index:4}
  .rail .sec,.rail .space,.rail .rb.sub,.rail .rbrand{display:none}
  .rb{width:auto;flex:none;white-space:nowrap}
  .amain{grid-column:1;grid-row:1;padding:16px 14px 0}
  .g2,.g3,.g4,.split{grid-template-columns:minmax(0,1fr)!important}
  .hide-m{display:none!important}
  .ccol{bottom:52px}
}

/* ---------- Componentes ---------- */
.card{background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:14.5px;font-weight:600}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.ah{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;justify-content:space-between}
.ah .tl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ah h2{font-size:22px;font-weight:700;line-height:1.25}
.meta{font-size:12.5px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px 2px 6px;border-radius:999px;white-space:nowrap}
.k-log{background:var(--k-log-bg);color:var(--k-log)} .k-err{background:var(--k-err-bg);color:var(--k-err)} .k-med{background:var(--k-med-bg);color:var(--k-med)}
.k-prm{background:var(--k-prm-bg);color:var(--k-prm)} .k-md{background:var(--k-md-bg);color:var(--k-md)} .k-url{background:var(--k-url-bg);color:var(--k-url)}
.k-idea{background:var(--k-idea-bg);color:var(--k-idea)} .k-dat{background:var(--k-dat-bg);color:var(--k-dat)} .k-cod{background:var(--k-cod-bg);color:var(--k-cod)}
.k-cmp{background:var(--k-cmp-bg);color:var(--k-cmp)} .k-inv{background:var(--k-inv-bg);color:var(--k-inv)} .k-doc{background:var(--k-doc-bg);color:var(--k-doc)}
.ref{font-family:var(--f-m);font-size:11.5px;font-weight:500;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:5px;border:0;cursor:pointer;white-space:nowrap}
.st{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--panel-2);color:var(--muted)}
.st.acc{background:var(--accent-soft);color:var(--accent)} .st.ok{background:var(--ok-soft);color:var(--ok)} .st.warn{background:var(--warn-soft);color:var(--warn)} .st.bad{background:var(--bad-soft);color:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gh{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn.dan{color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:12.5px}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.kbd{font-family:var(--f-m);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);color:var(--muted);white-space:nowrap}
.list{display:flex;flex-direction:column;gap:2px}
.it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1px 12px;align-items:center;padding:8px 10px;border-radius:9px;border:0;cursor:pointer;text-align:left;background:transparent;width:100%}
.it:hover{background:var(--panel-2)}
.it .ic{grid-column:1;grid-row:1/span 2}
.it .tt{grid-column:2;grid-row:1;font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .mm{grid-column:2;grid-row:2;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .rt{grid-column:3;grid-row:1/span 2;font-size:12px;color:var(--faint);white-space:nowrap}
.ti{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.stats{display:flex;flex-wrap:wrap;gap:12px 32px}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat .v{font-family:var(--f-d);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.hb{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px}
.hb .tr{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.hb .fi{display:block;height:100%;border-radius:4px;background:var(--accent)}
.hb .v{font-family:var(--f-m);font-size:11.5px;text-align:right;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line-2);vertical-align:middle}
td.n{font-family:var(--f-m);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel-2)} tr.on td{background:var(--accent-soft)}
.code{font-family:var(--f-m);font-size:12px;line-height:1.6;background:var(--panel-2);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre;margin:0;min-width:0}
.ph{color:var(--accent);background:var(--accent-soft);border-radius:3px;padding:0 3px}
.var{color:var(--k-prm);background:var(--k-prm-bg);border-radius:3px;padding:0 3px;font-weight:500}
.lv-ERROR{color:var(--bad);font-weight:600} .lv-WARN{color:var(--warn);font-weight:600} .lv-DEBUG{color:var(--muted)}
.ln{color:var(--faint);user-select:none;display:inline-block;min-width:3.2em}
.oc{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 3px;font-weight:600}
mark{background:var(--warn-soft);color:inherit;border-radius:2px;padding:0 1px}
details.more{border-top:1px solid var(--line-2);padding-top:10px}
details.more>summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"›";display:inline-block;transition:transform .15s;font-weight:700}
details.more[open]>summary::before{transform:rotate(90deg)}
details.more>div{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 18px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.verdict{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.verdict .big{font-family:var(--f-d);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.verdict.ok .big{color:var(--ok)} .verdict.warn .big{color:var(--warn)} .verdict.bad .big{color:var(--bad)}
.verdict .txt{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1;min-width:200px}
.gaps{display:flex;flex-direction:column;gap:6px}
.gap{display:flex;gap:9px;align-items:flex-start;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--panel-2)}
.gap .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--warn)}
.gap.hi .dot{background:var(--bad)} .gap.okk .dot{background:var(--ok)} .gap.acc .dot{background:var(--accent)}
.gap .gbody{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:13px;flex-wrap:wrap}
.banner b{color:var(--warn)}
.meter{height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
textarea,input[type=text]{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px 11px}
textarea{font-family:var(--f-m);font-size:12.5px;line-height:1.55;resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select,input[type=number]{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:3px 6px}
input[type=number]{width:54px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
svg text{font-family:var(--f-m);font-size:10.5px}

/* ---------- Chat de captura ---------- */
.feed{display:flex;flex-direction:column;gap:12px}
.day{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;margin:6px 0 2px}

.mhead{display:flex;align-items:center;gap:10px;min-width:0}

.rimor{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:10px;background:var(--panel-2);font-size:13.5px}

.mact{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-left:40px}
.mact .sp{flex:1}
.ibtn{border:0;background:transparent;color:var(--muted);padding:4px 7px;border-radius:6px;cursor:pointer;font-size:12.5px;display:inline-flex;gap:5px;align-items:center}
.ibtn:hover{background:var(--panel-2);color:var(--ink)}
.sess{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px dashed var(--line);flex-wrap:wrap}
.ccol{position:sticky;bottom:0;z-index:3}
.composer{padding:14px 0 calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--app) 26%);z-index:3}
.cbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px 8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 24px rgba(10,20,40,.08)}
.cbox:focus-within{border-color:var(--accent)}

.crow{display:flex;align-items:center;gap:8px}

.send{width:32px;height:32px;border-radius:9px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.cprev{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.cprev:empty{display:none}
.replying{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);padding:0 4px 6px}

/* ---------- Lienzo ---------- */
.canvas-wrap{overflow:auto;border-radius:12px;border:1px solid var(--line-2);background-color:var(--panel);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.canvas{position:relative;width:860px;height:520px}

function lineDiff(a,b){const A=a.split('\n'),B=b.split('\n'),n=A.length,m=B.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];let i=0,j=0;while(i<n&&j<m){if(A[i]===B[j]){out.push(['s',A[i]]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){out.push(['r',A[i]]);i++}else{out.push(['a',B[j]]);j++}}
  while(i<n)out.push(['r',A[i++]]);while(j<m)out.push(['a',B[j++]]);return out}
const varHTML=t=>esc(t).replace(/\{\{(\w+)\}\}/g,'<span class="var">{{$1}}</span>');

const TALIAS={log:'log',logs:'log',error:'err',errores:'err',mediciones:'med',prompt:'prm',prompts:'prm',documento:'md',md:'md',enlace:'url',enlaces:'url',url:'url',idea:'idea',ideas:'idea',datos:'dat',codigo:'cod',comando:'cmd',json:'jsn',toml:'jsn',texto:'txt',comparacion:'cmp',investigacion:'inv',doc:'doc'};
function parseQ(q){const f={tipo:[],en:[],tag:[],estado:[],words:[],neg:[]};(q.match(/"[^"]+"|\S+/g)||[]).forEach(tok=>{const t=noacc(tok);
  if(t.startsWith('tipo:'))t.slice(5).split(',').filter(Boolean).forEach(x=>f.tipo.push(TALIAS[x]||x));else if(t.startsWith('en:'))f.en.push(t.slice(3));else if(t.startsWith('#'))f.tag.push(t.slice(1));
  else if(t.startsWith('estado:'))f.estado.push(t.slice(7));else if(t.startsWith('-')&&t.length>1)f.neg.push(t.slice(1));else f.words.push(t.replace(/"/g,''))});return f}
function search(q){const f=parseQ(q);return ITEMS.map(it=>{
  if(f.tipo.length&&!f.tipo.includes(it.t))return null;if(f.en.length&&!f.en.some(e=>it.cols.includes(e)))return null;if(f.tag.length&&!f.tag.every(t=>it.tags.includes(t)))return null;
  if(f.estado.length&&!f.estado.includes(noacc(it.estado).replace(/\s/g,'')))return null;
  const tt=noacc(it.titulo+' '+it.res+' '+it.tags.join(' ')+' '+it.ref),dd=noacc(it.idx||'');if(f.neg.some(w=>tt.includes(w)))return null;
  const where=[];for(const w of f.words){if(tt.includes(w))where.push('t');else if(dd.includes(w))where.push('c');else return null}return {it,where}}).filter(Boolean)}

/* ---------- Documento ---------- */
const CIFRAS={'CMP-0004':{cambio:cambioTxt,p:pTxt(BENCH.p),n:'20'},'CMP-0005':{divergencia:String(CLOG.div+1)}};
const FIJADAS={'CMP-0004.cambio':'−4,6 %'};
function renderDoc(src){const lines=src.split('\n'),figs={};let fig=0,html='',ul=false,para=[];const stale=[],broken=[];
  lines.forEach(l=>{const m=l.match(/^!\[\[([A-Z-]+\d+)\|(\w+)\]\](?:\{#(fig:[\w-]+)\})?/);if(m){fig++;if(m[3])figs[m[3]]=fig}});fig=0;
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\{\{([A-Z-]+\d+)\.(\w+)\}\}/g,(m,r,f)=>{const cur=CIFRAS[r]&&CIFRAS[r][f],fx=FIJADAS[r+'.'+f];if(cur==null){broken.push(`{{${r}.${f}}}`);return `<span class="cifra bad">{{${r}.${f}}}</span>`}
      if(fx&&fx!==cur){stale.push({k:r+'.'+f,fx,cur});return `<span class="cifra old" title="Fijada ${fx}; ahora ${cur}">${fx}</span>`}return `<span class="cifra">${cur}</span>`})
    .replace(/\[\[([A-Z-]+\d+)\]\]/g,(m,r)=>byRef(r)?`<button class="ref" data-go="${r}">${r}</button>`:(broken.push(r),`<span class="cifra bad">${r}</span>`))
    .replace(/@(fig:[\w-]+)/g,(m,k)=>figs[k]?`figura ${figs[k]}`:(broken.push(k),`<span class="cifra bad">${k}</span>`));
  const fl=()=>{if(para.length){html+=`<p>${inline(para.join(' '))}</p>`;para=[]}},cu=()=>{if(ul){html+='</ul>';ul=false}};
  for(const l of lines){if(/^# /.test(l)){fl();cu();html+=`<h1>${inline(l.slice(2))}</h1>`;continue}if(/^## /.test(l)){fl();cu();html+=`<h2>${inline(l.slice(3))}</h2>`;continue}
    if(/^- /.test(l)){fl();if(!ul){html+='<ul>';ul=true}html+=`<li>${inline(l.slice(2))}</li>`;continue}
    const m=l.match(/^!\[\[([A-Z-]+\d+)\|(\w+)\]\](?:\{#(fig:[\w-]+)\})?\s*$/);if(m){fl();cu();fig++;html+=m[1]==='CMP-0004'&&m[2]==='grafico'?`<figure class="fig"><div class="tbl-wrap">${benchSVG(130)}</div><figcaption>Figura ${fig}. Latencia de reqwest y ureq con 64 KB, 20 repeticiones (${m[1]}).</figcaption></figure>`:`<figure class="fig"><figcaption>Figura ${fig}. ${m[2]} de ${m[1]}.</figcaption></figure>`;continue}
    if(!l.trim()){fl();cu();continue}cu();para.push(l)}
  fl();cu();return {html,stale,broken}}
function docBanner(r){if(!r.stale.length&&!r.broken.length)return `<div class="banner" style="background:var(--ok-soft)"><b style="color:var(--ok)">Todo al día.</b><span>Cifras y referencias coinciden con sus elementos.</span></div>`;
  return `<div class="banner"><b>${r.stale.length+r.broken.length} por revisar.</b><span style="flex:1">${r.stale.map(s=>`<span class="mono">${s.k}</span> se fijó en ${s.fx} y ahora vale ${s.cur}.`).join(' ')}${r.broken.length?` Referencias rotas: ${r.broken.map(esc).join(', ')}.`:''}</span>${r.stale.length?`<button class="btn sm" data-act="acceptcifra">Usar ${r.stale[0].cur}</button>`:''}</div>`}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('button,[data-go],tr[data-tpl]');if(!b)return;
  if(b.dataset.qadd!==undefined){const t=b.dataset.qadd,toks=S.q.split(/\s+/).filter(Boolean);S.q=toks.includes(t)?toks.filter(x=>x!==t).join(' '):(S.q+' '+t).trim();if($('#q')){$('#q').value=S.q;$('#sres').innerHTML=searchBody()}else go('buscar');return}
  if(b.dataset.qset!==undefined){S.q=b.dataset.qset;go('buscar');return}
  if(b.dataset.screen!==undefined){const k=b.dataset.screen;if(k.startsWith('col:')){toast(`Colección «${k.slice(4)}»: misma pantalla que «gateway»`);return}if(SC[k])go(k);return}
  if(b.dataset.go){const r=b.dataset.go;if(REFMAP[r]){if(REFMAP[r]!==S.screen)go(REFMAP[r])}else toast(`${r}: pantalla no incluida en esta referencia`);return}
  if(b.dataset.tpl!==undefined){S.logTpl=S.logTpl===b.dataset.tpl?null:b.dataset.tpl;render();return}
  if(b.dataset.ff){S.ff=b.dataset.ff;render();return}
  if(b.dataset.pv){S.pv=b.dataset.pv;render();return}
  if(b.dataset.toast!==undefined){if(b.dataset.toast)toast(b.dataset.toast);return}
  if(b.dataset.w){S.mobile=b.dataset.w==='m';document.body.classList.toggle('is-mobile',S.mobile);document.querySelectorAll('[data-w]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.w===b.dataset.w));if(S.screen==='lienzo')drawLinks();return}
  if(b.dataset.th!==undefined){const th=b.dataset.th;if(th)document.documentElement.setAttribute('data-theme',th);else document.documentElement.removeAttribute('data-theme');document.querySelectorAll('[data-th]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.th===th));return}
  if(b.id==='t-ids'){S.ids=!S.ids;b.setAttribute('aria-pressed',S.ids);b.textContent=S.ids?'Ocultar IDs':'Mostrar IDs';const f=document.querySelector('.frame');if(f)f.classList.toggle('ids-on',S.ids);return}
  switch(b.dataset.act){
    case 'send':sendComp();break;
    case 'reply':S.replyTo=b.dataset.ref;if(S.screen!=='inicio'){go('inicio')}else render();{const c=$('#comp');if(c){c.focus();c.scrollIntoView({block:'nearest'})}}break;
    case 'noreply':S.replyTo=null;render();break;
    case 'arch':S.archived.add(b.dataset.ref);toast(`${b.dataset.ref} archivado`);render();break;
    case 'alltpl':S.showAllTpl=!S.showAllTpl;render();break;
    case 'qclear':S.q='';$('#q').value='';$('#sres').innerHTML=searchBody();break;
    case 'acceptcifra':FIJADAS['CMP-0004.cambio']=cambioTxt;updDoc();toast('Cifra actualizada a '+cambioTxt);break;
    case 'export':toast('Exportado: '+$('#expfmt').value.replace(' · v0.4',''));break;
    case 'copyprompt':{const t=(S.pv==='v2'?PROMPT_V2:PROMPT_V1).replace(/\{\{(\w+)\}\}/g,(m,k)=>S.vals[k]||m);try{navigator.clipboard.writeText(t).then(()=>toast('Copiado con valores'),()=>toast('El navegador no deja copiar en esta vista'))}catch(e){toast('No se pudo copiar')}break}
  }});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.id==='comp'){S.comp=t.value;$('#cprev').innerHTML=compPreview();t.style.height='auto';t.style.height=Math.min(220,t.scrollHeight)+'px'}
  if(t.id==='q'){S.q=t.value;$('#sres').innerHTML=searchBody()}
  if(t.id==='interp'){S.interp=t.value;const g=gaps();if($('#gapsbox'))$('#gapsbox').innerHTML=gapsHTML();$('#gapbanner').innerHTML=`<b>${g.length} cosas por revisar</b><span style="flex:1">${esc(g[0].text)}</span>`}
  if(t.id==='docsrc')updDoc();
  if(t.dataset.var)S.vals[t.dataset.var]=t.value;
  if(t.dataset.cw!==undefined){S.crit[+t.dataset.cw].w=Math.max(0,Math.min(10,parseFloat(t.value)||0));$('#decout').innerHTML=decOut()}});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.dataset.s){const [i,j]=t.dataset.s.split('-').map(Number);S.crit[i].s[j]=+t.value;$('#decout').innerHTML=decOut()}
  if(t.dataset.imp){S.impMode=t.dataset.imp;render()}
  if(t.id==='sel')go(t.value)});
function updDoc(){const src=$('#docsrc');if(src)S.doc=src.value;const r=renderDoc(S.doc);if($('#docprev'))$('#docprev').innerHTML=r.html;if($('#docbanner'))$('#docbanner').innerHTML=docBanner(r)}
document.addEventListener('keydown',ev=>{if(ev.target.id==='comp'&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();sendComp()}});
document.addEventListener('paste',ev=>{const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;const t=(ev.clipboardData&&ev.clipboardData.getData('text'))||'';if(!t.trim())return;ev.preventDefault();
  S.comp=t;if(S.screen!=='inicio'&&S.screen!=='hilo')go('inicio');else render();const c=$('#comp');if(c){c.focus();c.scrollIntoView({block:'nearest'})}});
/* Arrastrar en el lienzo */
let drag=null;
document.addEventListener('pointerdown',ev=>{const c=ev.target.closest('.ccard');if(!c)return;drag={el:c,id:c.dataset.node,sx:ev.clientX,sy:ev.clientY,x:c.offsetLeft,y:c.offsetTop};try{c.setPointerCapture(ev.pointerId)}catch(e){}});
document.addEventListener('pointermove',ev=>{if(!drag)return;const x=Math.max(0,Math.min(860-drag.el.offsetWidth,drag.x+ev.clientX-drag.sx)),y=Math.max(0,Math.min(520-drag.el.offsetHeight,drag.y+ev.clientY-drag.sy));drag.el.style.left=x+'px';drag.el.style.top=y+'px';S.canvas[drag.id]=[x,y];drawLinks()});
document.addEventListener('pointerup',()=>{drag=null});

(function(){const h=(location.hash||'').slice(1);if(SC[h])S.screen=h;render()})();
</script>

</body></html>
