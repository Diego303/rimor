packages:
  - paquetes/*
# Las dependencias viven en el almacén global de pnpm y node_modules solo las enlaza: en discos lentos
# (por ejemplo /mnt/* en WSL) las comprobaciones pasan de minutos a segundos.
enableGlobalVirtualStore: true
allowBuilds:
  esbuild: false
  sharp: false
# Dependencias indirectas fijadas a versiones publicadas hace más de dos semanas (IN-025).
overrides:
  '@lezer/lr': 1.4.10
